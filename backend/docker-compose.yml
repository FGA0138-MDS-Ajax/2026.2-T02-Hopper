services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: aulacerta
      POSTGRES_PASSWORD: aulacerta
      POSTGRES_DB: aulacerta
    ports:
      - '5432:5432'
    volumes:
      - dados:/var/lib/postgresql/data
  banco-teste:
    image: postgres:16
    environment:
      POSTGRES_USER: aulacerta
      POSTGRES_PASSWORD: aulacerta
      POSTGRES_DB: aulacerta_teste
    ports:
      - '5433:5432'
  api:
    build: .
    depends_on:
      - banco
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://aulacerta:aulacerta@banco:5432/aulacerta?schema=public
      JWT_SECRET: segredo-local-com-mais-de-32-caracteres-aqui
      JWT_EXPIRES_IN: 2h
      CORS_ORIGIN: http://localhost:5173
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: usuario
      SMTP_PASS: senha
      SMTP_FROM: AulaCerta <nao-responda@aulacerta.com.br>
      FRONTEND_URL: http://localhost:5173
    ports:
      - '3333:3333'
volumes:
  dados:
